# Back4App Containers / Docker Compose Configuration
version: '3.8'

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    image: signbridge-ai:latest
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - PSL_CONFIDENCE_THRESHOLD=0.30
    restart: always

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: signbridge-backend:latest
    ports:
      - "5000:5000"
    environment:
      - AIService__BaseUrl=http://ai-service:8001/
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      - ai-service
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: signbridge-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend-api
      - ai-service
    restart: always
